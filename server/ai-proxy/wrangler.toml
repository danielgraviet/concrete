name = "concrete-ai-proxy"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# Use the current Cloudflare account's generated URL: https://<name>.<subdomain>.workers.dev
workers_dev = true

# Secret (never put it here):
#   OPENROUTER_API_KEY  -> `npx wrangler secret put OPENROUTER_API_KEY`
#   Use a dedicated OpenRouter key with a $20/month credit limit (see README "Spend cap").
# For local `wrangler dev`, put it in .dev.vars (gitignored):  OPENROUTER_API_KEY=sk-or-...

[vars]
# Firebase project the web app signs users into. Tokens must have iss/aud for this project.
FIREBASE_PROJECT_ID = "concrete-e17d0"
# Comma-separated list of web origins allowed to call the proxy ("*" allows any; avoid in prod).
ALLOWED_ORIGINS = "https://app.useconcrete.app,http://localhost:5173"
# Sent to OpenRouter as HTTP-Referer (app attribution). Usually your production web origin.
APP_URL = "https://app.useconcrete.app"
# OpenRouter model used when the client sends none, or one not in ALLOWED_MODELS.
DEFAULT_MODEL = "deepseek/deepseek-v4-flash-0731"
# Comma-separated OpenRouter model ids clients may choose. Keep in sync with
# OPENROUTER_MODEL_OPTIONS in src/ai/openRouterModels.ts. DEFAULT_MODEL is always allowed.
ALLOWED_MODELS = "deepseek/deepseek-v4-flash-0731,qwen/qwen3.8-27b,qwen/qwen3.7-flash,openai/gpt-5.6-luna,openai/gpt-4o-mini"
# Server-side ceiling for max_tokens; larger client values are clamped.
MAX_TOKENS_CAP = "8000"
# Requests per user per UTC month.
QUOTA_MONTHLY = "100"
# Optional comma-separated Firebase uids exempt from the monthly quota (e.g. the owner).
QUOTA_ALLOWLIST_UIDS = "cD9SwH0h5BVJcGPQf9UVezlX4j83"
# Largest single image/PDF upload to /v1/files, in MB.
MAX_FILE_MB = "20"
# Total file storage per user (R2 bytes), in MB. Separate from the AI quota.
STORAGE_QUOTA_MB = "100"

[[d1_databases]]
binding = "DB"
database_name = "concrete-ai-quota"
# Paste the id printed by `npx wrangler d1 create concrete-ai-quota`.
database_id = "83bbf331-a926-4eab-8361-a3fd8dab0a5a"
migrations_dir = "migrations"

# Images and PDFs for the web app. Create once: `npx wrangler r2 bucket create concrete-files`.
# Without this binding the /v1/files and /v1/storage routes answer 503 files_unavailable.
[[r2_buckets]]
binding = "FILES"
bucket_name = "concrete-files"

[observability]
enabled = true
