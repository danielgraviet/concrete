name: Release Linux

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    name: Package Linux release
    runs-on: ubuntu-24.04

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build AppImage and Debian package
        run: npm run pack:linux

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          # electron-builder is deliberately run with --publish never; this
          # action publishes using the short-lived token GitHub issues to the
          # workflow, so no personal access token is required.
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/Concrete-*.AppImage
            release/concrete_*_amd64.deb
